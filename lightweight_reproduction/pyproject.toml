[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "huge-lightweight-reproduction"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "matplotlib>=3.8", "pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
huge-lightweight = "huge_lightweight.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/huge_lightweight"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
